(async function () {

    if (/NaN|undefined|Infinity/.test(rootG.outerHTML.replace(/<text[^>]*>[^<]*<\/text>/g, ''))) return 'NaN or undefined found in attributes';

        if (BOXY.includes(k)) {
          const m = k === 'chip' ? 6 : 10;
          if (tb.x < sb.x + m - 0.5 || tb.x + tb.width > sb.x + sb.width - m + 0.5 || tb.y < sb.y + 3 || tb.y + tb.height > sb.y + sb.height - 3) return 'text "' + t.textContent + '" in ' + label + ' touches the border of its shape';
        } else if (k === 'diamond') {
          const cx = sb.x + sb.width / 2, cy = sb.y + sb.height / 2;
          for (const [px, py] of [[tb.x, tb.y], [tb.x + tb.width, tb.y], [tb.x, tb.y + tb.height], [tb.x + tb.width, tb.y + tb.height]]) if (Math.abs(px - cx) / (sb.width / 2) + Math.abs(py - cy) / (sb.height / 2) > 0.98) return 'text "' + t.textContent + '" in ' + label + ' pokes out of the diamond';
        }
      }
    }
    // arrow heads: the tip sits on the border of the target (or source) node
    for (const e of svgEl.querySelectorAll('g.md-edge')) {

        const tip = h.points.getItem(0), ids = [e.dataset.to, e.dataset.from];
        let ok = false;
        for (const id of ids) {
          const ng = svgEl.querySelector('g.md-n[data-id="' + id + '"]'); if (!ng) continue;
          const sh = ng.querySelectorAll('.md-shape'), s = sh[sh.length - 1]; if (!s || !['box', 'pill', 'chip', 'ghost', 'diamond', 'kpi', 'cylinder', 'group', 'stack'].includes(ng.dataset.kind)) { ok = true; continue; }
          const b = s.getBBox(), d = Math.min(Math.abs(tip.x - b.x), Math.abs(tip.x - b.x - b.width), Math.abs(tip.y - b.y), Math.abs(tip.y - b.y - b.height));
          const inside = tip.x >= b.x - 0.6 && tip.x <= b.x + b.width + 0.6 && tip.y >= b.y - 0.6 && tip.y <= b.y + b.height + 0.6;

        return 'PASS threw ' + e.message;

    MotionDiagram.update(svg, { step: n, capture: true });
    const a = svg.outerHTML; MotionDiagram.update(svg, { step: n, capture: true });
    if (svg.outerHTML !== a) return 'update is not idempotent';
    const bad = inspect(svg, spec); if (bad) return bad;

    if (els !== want) return els + ' elements rendered for ' + want + ' spec items';
    const shown = svg.querySelectorAll('g.md-el:not(.md-hid)').length, hidden = (spec.nodes || []).concat(spec.edges || []).filter((o) => o.out && o.out <= n).length;
    if (shown < want - hidden - 3 * (spec.edges || []).filter((e) => e.out).length) return 'too many hidden elements at the final step';
    MotionDiagram.update(svg, { step: 0, replay: true });

    const cap = q.get('capture') === '1', step = q.has('step') ? +q.get('step') : n;
    MotionDiagram.update(svg, { step, replay: true, capture: cap });
    out.textContent = name + ' steps=' + n;
  }
  try {
    if (q.get('selftest') === '1') out.textContent = selftest().replace(/^(?!PASS)/, 'FAIL ');
    else show();
  } catch (e) { out.textContent = (q.get('selftest') === '1' ? 'FAIL ' : '') + e.message; }
  window.__labDone = true;
})();
</script>
